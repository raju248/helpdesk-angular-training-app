<section class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm sm:p-8">
  <div class="flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">
    <h1 class="text-3xl font-bold tracking-tight">{{ 'tickets.title' | translate }}</h1>
    <a
      routerLink="/tickets/new"
      queryParamsHandling="preserve"
      class="self-start rounded-lg bg-indigo-600 px-4 py-2 text-sm font-medium text-white hover:bg-indigo-700 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600"
    >
      {{ 'common.createTicket' | translate }}
    </a>
  </div>
  <p class="mt-3 leading-7 text-slate-600">
    {{ 'tickets.description' | translate }}
  </p>

  <div class="mt-6">
    <label for="ticket-search" class="block text-sm font-medium">{{ 'tickets.search' | translate }}</label>
    <input
      id="ticket-search"
      name="search"
      type="search"
      autocomplete="off"
      [ngModel]="searchTerm"
      (ngModelChange)="search($event)"
      class="mt-2 block w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:border-indigo-600 focus:outline-2 focus:outline-indigo-600"
    />
  </div>

  <div class="mt-4 flex flex-col gap-4 sm:flex-row sm:items-end">
    <div class="flex-1">
      <label for="status-filter" class="block text-sm font-medium">{{ 'common.status' | translate }}</label>
      <select
        id="status-filter"
        name="status"
        [(ngModel)]="statusFilter"
        (ngModelChange)="updateFilters()"
        class="mt-2 block w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm focus:border-indigo-600 focus:outline-2 focus:outline-indigo-600"
      >
        <option value="">{{ 'tickets.allStatuses' | translate }}</option>
        <option *ngFor="let option of statusOptions" [value]="option.value">{{ option.label | translate }}</option>
      </select>
    </div>
    <div class="flex-1">
      <label for="priority-filter" class="block text-sm font-medium">{{ 'common.priority' | translate }}</label>
      <select
        id="priority-filter"
        name="priority"
        [(ngModel)]="priorityFilter"
        (ngModelChange)="updateFilters()"
        class="mt-2 block w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm focus:border-indigo-600 focus:outline-2 focus:outline-indigo-600"
      >
        <option value="">{{ 'tickets.allPriorities' | translate }}</option>
        <option *ngFor="let option of priorityOptions" [value]="option.value">{{ option.label | translate }}</option>
      </select>
    </div>
    <button
      type="button"
      (click)="clearFilters()"
      [disabled]="!statusFilter && !priorityFilter && !searchTerm"
      class="self-start rounded-lg border border-slate-300 px-3 py-2 text-sm font-medium text-slate-700 hover:bg-slate-50 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600 disabled:cursor-default disabled:opacity-50 sm:self-auto"
    >
      {{ 'tickets.clearFilters' | translate }}
    </button>
  </div>

  <app-ticket-list-view
    class="block"
    [tickets]="tickets"
    [loading]="loading"
    [errorMessage]="errorMessage"
    [hasFilters]="!!(statusFilter || priorityFilter || searchTerm)"
    (retry)="loadTickets()"
    (openTicket)="openTicket($event)"
  />
</section>
