<section class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm sm:p-8">
  <h1 class="text-3xl font-bold tracking-tight">Tickets</h1>
  <p class="mt-3 leading-7 text-slate-600">
    Track your support requests and follow their progress.
  </p>

  <p *ngIf="loading" role="status" class="mt-6 text-slate-600">Loading tickets...</p>

  <div *ngIf="errorMessage" role="alert" class="mt-6 rounded-lg bg-red-50 p-4 text-red-700">
    <p>{{ errorMessage }}</p>
    <button
      type="button"
      (click)="loadTickets()"
      class="mt-3 rounded-lg border border-red-300 px-3 py-2 text-sm font-medium hover:bg-red-100 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-red-600"
    >
      Try again
    </button>
  </div>

  <p *ngIf="!loading && !errorMessage && tickets.length === 0" class="mt-6 text-slate-600">
    No tickets yet.
  </p>

  <ul *ngIf="!loading && !errorMessage && tickets.length > 0" class="mt-6 space-y-4">
    <li *ngFor="let ticket of tickets">
      <article
        [appPriorityHighlight]="ticket.priority"
        class="rounded-xl border border-slate-200 bg-white p-4 sm:p-5"
      >
        <div class="flex flex-col gap-3 sm:flex-row sm:items-start sm:justify-between">
          <div>
            <h3 class="font-semibold">{{ ticket.title }}</h3>
            <p class="mt-2 text-sm leading-6 text-slate-600">{{ ticket.description }}</p>
          </div>
          <app-ticket-status-badge [status]="ticket.status" />
        </div>

        <div class="mt-4 flex flex-col gap-3 text-sm sm:flex-row sm:items-center sm:justify-between">
          <div class="flex flex-wrap gap-x-4 gap-y-2 text-slate-600">
            <p>Priority: <span class="font-medium capitalize">{{ ticket.priority }}</span></p>
            <p>Updated <time [attr.datetime]="ticket.updatedAt">{{ ticket.updatedAt | timeAgo }}</time></p>
          </div>
          <a
            [routerLink]="['/tickets', ticket.id]"
            class="self-start rounded-lg bg-indigo-600 px-3 py-2 font-medium text-white hover:bg-indigo-700 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600"
          >
            Open ticket
          </a>
        </div>
      </article>
    </li>
  </ul>
</section>
