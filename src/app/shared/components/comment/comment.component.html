<article class="rounded-xl border border-slate-200 bg-slate-50 p-4">
  <div class="flex flex-wrap items-center justify-between gap-2 text-sm">
    <p class="font-medium">{{ userName || ('common.unknownUser' | translate) }}</p>
    <time [attr.datetime]="comment.createdAt" class="text-slate-500">{{ comment.createdAt | timeAgo | async }}</time>
  </div>
  <p class="mt-3 break-words whitespace-pre-line leading-6 text-slate-700">{{ comment.body }}</p>
</article>
